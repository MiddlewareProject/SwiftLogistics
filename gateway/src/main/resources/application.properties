```properties
spring.application.name=gateway

server.port=8080

# ============================================================
# ORDER SERVICE
# ============================================================

spring.cloud.gateway.mvc.routes[0].id=order-service
spring.cloud.gateway.mvc.routes[0].uri=http://order-service:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/orders/**


# ============================================================
# TRACKING SERVICE
# ============================================================

spring.cloud.gateway.mvc.routes[1].id=tracking-service
spring.cloud.gateway.mvc.routes[1].uri=http://tracking-service:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/tracking/**


# ============================================================
# CMS ADAPTER
# ============================================================

spring.cloud.gateway.mvc.routes[2].id=cms-adapter
spring.cloud.gateway.mvc.routes[2].uri=http://cms-adapter:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/cms/**


# ============================================================
# ROS ADAPTER
# ============================================================

spring.cloud.gateway.mvc.routes[3].id=ros-adapter
spring.cloud.gateway.mvc.routes[3].uri=http://ros-adapter:8084
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/ros/**


# ============================================================
# WMS ADAPTER
# ============================================================

spring.cloud.gateway.mvc.routes[4].id=wms-adapter
spring.cloud.gateway.mvc.routes[4].uri=http://wms-adapter:8085
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/wms/**


# ============================================================
# NOTIFICATION SERVICE
# ============================================================

spring.cloud.gateway.mvc.routes[5].id=notification-service
spring.cloud.gateway.mvc.routes[5].uri=http://notification-service:8086
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/notifications/**
