spring.application.name=notification-service

server.port=8086

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:swift}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:swift}

spring.rabbitmq.listener.simple.missing-queues-fatal=false

spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:5432/swiftlogistics
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true